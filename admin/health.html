<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Health</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 32px; font-size: 14px; }
  pre { background: #1a1a1a; border: 1px solid #333; padding: 16px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
  .ok { color: #4f4; }
  .err { color: #f44; }
  a { color: #6cf; }
  button { margin-top: 12px; padding: 8px 16px; background: #333; color: #eee; border: 1px solid #555; cursor: pointer; font-family: monospace; }
</style>
</head>
<body>
<h2>/api/health</h2>
<pre id="out">loading...</pre>
<button onclick="check()">refresh</button>
<br><br>
<a href="/admin/reviews.html">reviews</a> · <a href="/">site</a>
<script>
async function check() {
  const el = document.getElementById('out');
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    el.innerHTML = JSON.stringify(d, null, 2)
      .replace(/"connected[^"]*"/g, '<span class="ok">$&</span>')
      .replace(/"error[^"]*"/g, '<span class="err">$&</span>');
  } catch(e) {
    el.innerHTML = '<span class="err">FETCH FAILED: ' + e.message + '</span>';
  }
}
check();
</script>
</body>
</html>
